name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      # Dos apps desde un mismo repo: el companion (fino) y neopen (completa).
      - name: Build debug APKs (companion + neopen)
        run: ./gradlew :companion:assembleDebug :neopen:assembleDebug --stacktrace

      - name: Renombrar APKs
        run: |
          cp companion/build/outputs/apk/debug/companion-debug.apk neopen-companion-debug.apk
          cp neopen/build/outputs/apk/debug/neopen-debug.apk neopen-debug.apk

      - name: Subir APKs como artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neopen-apks-debug
          path: |
            neopen-companion-debug.apk
            neopen-debug.apk
          if-no-files-found: error

      # Release versionada cuando se empuja un tag v* (p. ej. v0.2.0).
      - name: Publicar release en tags v*
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            neopen-companion-debug.apk
            neopen-debug.apk
          generate_release_notes: true

      # Release "rolling" siempre actualizada con la última build de main.
      - name: Actualizar release «latest» en cada push a main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Última build (main)
          prerelease: true
          body: |
            APKs de depuración generados automáticamente desde la última build de `main`.

            - **neopen-companion-debug.apk** — app companion (captura del boli → subida).
            - **neopen-debug.apk** — app completa neopen (cuadernos offline + sincronización).

            Para una versión estable, descarga una release con etiqueta `v*`.
          files: |
            neopen-companion-debug.apk
            neopen-debug.apk

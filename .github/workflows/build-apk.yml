name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Validar contrato, esquemas y permisos
        run: ./gradlew checkApiContract checkFileModes --stacktrace

      # Incluye regresiones del outbox/delta con Room y HTTP simulado (Robolectric).
      - name: Tests unitarios (core y sincronización Android)
        run: ./gradlew :core:testDebugUnitTest :neopen:testDebugUnitTest --stacktrace

      # App unificada (completa, con modo "solo puente" integrado).
      - name: Build debug APK (neopen)
        run: ./gradlew :neopen:assembleDebug --stacktrace

      - name: Verificar candidato F-Droid sin firma ni módulo live
        env:
          # Debe ignorarse incluso cuando existe una clave local/de CI.
          NEOPEN_KEYSTORE_PATH: signing/neopen-full.keystore
          NEOPEN_KEYSTORE_PASSWORD: deliberately-invalid
        run: |
          ./gradlew -Pfdroid :neopen:assembleRelease --stacktrace
          apk=neopen/build/outputs/apk/release/neopen-release-unsigned.apk
          test -s "$apk"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          if "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$apk"; then
            echo "Error: F-Droid debe recibir un APK sin firmar"
            exit 1
          fi

      - name: Renombrar APK
        run: cp neopen/build/outputs/apk/debug/neopen-debug.apk neopen-debug.apk

      # No bloquea la build si falla (p. ej. cuota de artifacts de Actions llena): el
      # artifact es solo una comodidad para PRs; la release adjunta el APK aparte como
      # release asset (otro almacenamiento), así que un fallo aquí no debe tumbar la release.
      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: neopen-apks-debug
          path: |
            neopen-debug.apk
          if-no-files-found: error

      # Release versionada cuando se empuja un tag v* (p. ej. v0.2.0).
      - name: Publicar release en tags v*
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            neopen-debug.apk
          generate_release_notes: true

      # Release "rolling" siempre actualizada con la última build de main.
      - name: Actualizar release «latest» en cada push a main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Última build (main)
          prerelease: true
          body: |
            APK de depuración generado automáticamente desde la última build de `main`.

            - **neopen-debug.apk** — app neopen unificada (puente + cuadernos + sincronización).

            Para una versión estable, descarga una release con etiqueta `v*`.
          files: |
            neopen-debug.apk

  migrations-and-sync:
    name: Migraciones Room y sync (emulador oficial)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ejecutar migraciones y sync en Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew :neopen:connectedDebugAndroidTest --stacktrace

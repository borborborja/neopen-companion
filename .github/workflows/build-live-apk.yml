name: Build LIVE APK (escritura en vivo)

# Pipeline PARALELO al oficial (build-apk.yml). Construye la variante `live`, que tiene
# applicationId `net.micapum.neopen.live` y se llama "neopen LIVE", para poder instalarla
# JUNTO a la app oficial en el mismo dispositivo y probar la feature de escritura en vivo.

on:
  push:
    branches: ["main"]
    paths: ["live/**", "core/**", ".github/workflows/build-live-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      # App slim :live (release con R8 + arm64) → applicationId net.micapum.neopen.live.
      - name: Build LIVE APK (:live release)
        run: ./gradlew :live:assembleRelease --stacktrace

      - name: Renombrar APK
        run: cp live/build/outputs/apk/release/live-release.apk neopen-live.apk

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: neopen-apk-live
          path: neopen-live.apk
          if-no-files-found: error

      # Release "rolling" para descargar fácil al móvil (tag `live`, no choca con `latest`).
      - name: Actualizar release «live»
        uses: softprops/action-gh-release@v2
        with:
          tag_name: live
          name: Escritura en vivo (build de prueba)
          prerelease: true
          body: |
            App slim **neopen Live** (boli + teclado de escritura en vivo), build de `main`.

            - **neopen-live.apk** — applicationId `net.micapum.neopen.live`, nombre **"neopen Live"**.
            - App aparte y ligera (~13 MB, arm64 + R8): se instala EN PARALELO a la app oficial.
            - **Solo arm64-v8a** (móviles modernos; no instala en emuladores x86 ni ARM de 32 bits).

            Cómo probar: instala el APK → abre "neopen Live" → **Conectar boli** y **Descargar
            modelo** → en Ajustes de Android activa y selecciona el teclado **"neopen — escritura
            en vivo"** → abre cualquier app y escribe en la hoja Ncode.
          files: neopen-live.apk

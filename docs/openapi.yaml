  /api/auth/session:
    get:
      tags:
        - auth
      summary: Restaura la sesión del navegador y obtiene su token CSRF
      security: &a5
        - WebSession: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSessionInfo"
        "401":
          description: La cookie de sesión no existe o ha caducado
    post:
      tags:
        - auth
      summary: Inicia sesión con APP_PASSWORD y crea la cookie HttpOnly
      security:
        - PenPassword: []
      description: Requiere X-Auth-Password incluso si ya existe cookie. Renueva la sesión y descarta la anterior.
        Cookie neopen_session, SameSite=Lax, duración máxima de ocho horas, Secure bajo HTTPS. Nunca devuelve
        la contraseña.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSessionInfo"
          headers:
            Set-Cookie:
              description: Cookie opaca de sesión HttpOnly
              schema: &a4
                type: string
        "401":
          description: Contraseña incorrecta o ausente
        "429":
          description: Demasiados intentos
    delete:
      tags:
        - auth
      summary: Revoca la sesión actual y elimina su cookie
      security: &a1
        - PenPassword: []
        - WebSession: []
          CsrfToken: []
      responses:
        "204":
          description: Sesión cerrada
        "401":
          description: Sesión no válida
        "403":
          description: Token CSRF incorrecto o ausente

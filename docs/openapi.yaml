        "400":
          description: Origen o configuración inválidos
        "401":
          description: No autorizado
        "403":
          description: CSRF inválido
  /.well-known/oauth-protected-resource/mcp:
    get:
      tags:
        - mcp
      summary: Descubrimiento RFC 9728 del recurso MCP
      security: &a2 []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - resource
                  - authorization_servers
                  - scopes_supported
                  - bearer_methods_supported
                properties:
                  resource:
                    type: string
                    format: uri
                  authorization_servers:
                    type: array
                    items:
                      type: string
                      format: uri
                  scopes_supported:
                    type: array
                    items:
                      type: string
                      enum:
                        - notes:read
                        - notes:write
                  bearer_methods_supported:
                    type: array
                    items:
                      type: string
                      const: header
                additionalProperties: false
        "404": &a3
          description: MCP desactivado
  /.well-known/oauth-authorization-server/oauth:
    get:
      tags:
        - oauth
      summary: Metadatos públicos del servidor de autorización
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthMetadata"
        "404":

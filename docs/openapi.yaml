        - mcp
      summary: Estado persistente y URL de conexión MCP
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpSettings"
        "401":
          description: No autorizado
    put:
      tags:
        - mcp
      summary: Activa o desactiva MCP para toda la instancia
      security: *a1
      description: Desactivado por defecto. Activar exige un origen HTTPS puro; HTTP solo se admite en localhost. El
        origen se fija desde la web autenticada, nunca desde Host o X-Forwarded-*. Desactivar o cambiar origen
        revoca las autorizaciones OAuth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
                origin:
                  type: string
                  format: uri
                  description: Origen de la web, sin ruta, usuario, query ni fragmento
              additionalProperties: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:

        "404":
          description: MCP desactivado
    options:
      tags:
        - oauth
      summary: Preflight CORS del protocolo OAuth
      security: *a2
      responses:
        "200":
          description: CORS permitido
        "204":
          description: CORS permitido
        "404": *a3
  /oauth/.well-known/oauth-authorization-server:
    get:
      tags:
        - oauth
      summary: Metadatos públicos del servidor de autorización
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthMetadata"
        "404":
          description: MCP desactivado
    options:
      tags:
        - oauth
      summary: Preflight CORS del protocolo OAuth
      security: *a2
      responses:
        "200":
          description: CORS permitido
        "204":
          description: CORS permitido
        "404": *a3
  /oauth/authorize:
    get:
      tags:
        - oauth
      summary: Inicia Authorization Code con PKCE S256
      security: *a2
      description: Emite una interacción que reutiliza el login web y requiere consentimiento. No acepta password
        grant ni client_credentials. El issuer es el origen canónico más /oauth.
      parameters:
        - name: client_id
          in: query
          required: true
          schema: *a4
        - name: redirect_uri
          in: query
          required: false
          schema: *a4
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            const: code
        - name: scope
          in: query
          required: false
          schema: *a4
        - name: code_challenge
          in: query
          required: true
          schema: *a4
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            const: S256
        - name: state
          in: query
          required: false
          schema: *a4
        - name: resource
          in: query
          required: false
          schema: *a4
      responses:
        "302":
          description: Redirección OAuth
        "303":
          description: Interacción de login/consentimiento o callback del cliente
          headers:
            Location:
              schema: *a4
        "400":
          description: Solicitud, redirección, recurso o PKCE inválidos
        "404": *a3
  /oauth/authorize/{uid}:
    get:
      tags:
        - oauth
      summary: Reanuda una autorización tras el consentimiento
      security: *a2
      parameters:
        - &a6
          name: uid
          in: path
          required: true
          schema: *a4
      responses:
        "302":
          description: Callback OAuth
        "303":
          description: Callback con code, state e iss, o error=access_denied
        "400":
          description: Interacción caducada o no válida
        "404": *a3
  /oauth/interaction/{uid}/details:
    get:
      tags:
        - oauth
      summary: Cliente y permisos de la solicitud de consentimiento
      security: *a5
      parameters:
        - *a6
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthInteractionDetails"
        "400":
          description: Interacción no válida o caducada
        "401":
          description: Falta sesión de neopen
        "404": *a3
  /oauth/interaction/{uid}/confirm:
    post:
      tags:
        - oauth
      summary: Autoriza o deniega la conexión desde la sesión web
      security:
        - WebSession: []
          CsrfToken: []
      parameters:
        - *a6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - approve
              properties:
                approve:
                  type: boolean
              additionalProperties: false
      responses:
        "200":
          description: URL para reanudar el protocolo OAuth
          content:
            application/json:
              schema:
                type: object
                required:
                  - redirectTo
                properties:
                  redirectTo:
                    type: string
                    format: uri-reference
                additionalProperties: false
        "400":
          description: Interacción o decisión inválidas
        "401":
          description: Falta sesión de neopen
        "403":
          description: CSRF inválido
        "404": *a3
  /oauth/token:
    post:
      tags:
        - oauth
      summary: Canjea un código PKCE o renueva un token de acceso
      security: *a2
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - grant_type
                - client_id
              properties:
                grant_type:
                  type: string
                  enum:
                    - authorization_code
                    - refresh_token
                client_id: *a4
                code: *a4
                code_verifier: *a4
                redirect_uri:
                  type: string
                  format: uri
                refresh_token: *a4
                resource:
                  type: string
                  format: uri
                scope: *a4
              additionalProperties: false
      responses:
        "200":
          description: Token opaco para la audiencia MCP; el refresco rota al utilizarse
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                  - token_type
                  - expires_in
                properties:
                  access_token: *a4
                  token_type:
                    type: string
                    const: Bearer
                  expires_in:
                    type: integer
                    maximum: 3600
                  refresh_token: *a4
                  scope: *a4
                additionalProperties: false
        "400":
          description: Código, PKCE, cliente o refresco no válidos; el reuso revoca la cadena
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "404": *a3
    options:
      tags:
        - oauth
      summary: Preflight CORS del protocolo OAuth
      security: *a2
      responses:
        "200":
          description: CORS permitido
        "204":
          description: CORS permitido
        "404": *a3
  /oauth/register:
    post:
      tags:
        - oauth
      summary: Registro dinámico DCR de un cliente OAuth público
      security: *a2
      description: Alternativa a CIMD para clientes compatibles. No concede acceso hasta el consentimiento del
        propietario. Límite de 20 registros por minuto e IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - redirect_uris
              properties:
                redirect_uris:
                  type: array
                  items:
                    type: string
                    format: uri
                client_name: *a4
                token_endpoint_auth_method:
                  type: string
                  const: none
                response_types:
                  type: array
                  items:
                    type: string
                    const: code
                grant_types:
                  type: array
                  items:
                    type: string
                    enum:
                      - authorization_code
                      - refresh_token
                application_type:
                  type: string
                  enum:
                    - web
                    - native
      responses:
        "201":
          description: Cliente registrado
          content:
            application/json:
              schema:
                type: object
                required:
                  - client_id
                properties:
                  client_id: *a4
                  redirect_uris:
                    type: array
                    items: *a4
                  client_name: *a4
        "400":
          description: Metadatos de cliente inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "404": *a3
        "429":
          description: Demasiados registros
  /oauth/register/{clientId}:
    get:
      tags:
        - oauth
      summary: Lectura de metadatos de registro del proveedor OAuth
      security:
        - OAuthRegistrationToken: []
      parameters:
        - name: clientId
          in: path
          required: true
          schema: *a4
      description: Endpoint estándar del proveedor. La administración dinámica está desactivada y las conexiones MCP
        usan CIMD o el client_id devuelto al registrar.
      responses:
        "200":
          description: Metadatos de registro
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Token de registro no válido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "404": *a3
  /oauth/revoke:
    post:
      tags:
        - oauth
      summary: Revoca un token y su concesión OAuth
      security: *a2
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - token
                - client_id
              properties:
                token: *a4
                client_id: *a4
                token_type_hint:
                  type: string
                  enum:
                    - access_token
                    - refresh_token
              additionalProperties: false
      responses:
        "200":
          description: Revocación procesada; no revela si existía el token
        "400":
          description: Petición inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "404": *a3
    options:
      tags:
        - oauth
      summary: Preflight CORS del protocolo OAuth
      security: *a2
      responses:
        "200":
          description: CORS permitido
        "204":
          description: CORS permitido
        "404": *a3
  /oauth/jwks:
    get:
      tags:
        - oauth
      summary: Claves públicas del proveedor OAuth
      security: *a2
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - keys
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                additionalProperties: false
        "404": *a3
    options:
      tags:
        - oauth
      summary: Preflight CORS del protocolo OAuth
      security: *a2
      responses:
        "200":
          description: CORS permitido
        "204":
          description: CORS permitido
        "404": *a3
  /mcp:
    post:
      tags:
        - mcp
      summary: Endpoint Streamable HTTP para herramientas y recursos MCP
      security: &a7
        - McpOAuth:
            - notes:read
      description: Acepta MCP moderno y clientes anteriores mediante el SDK oficial. Los tokens solo sirven para
        este recurso. Cada herramienta comprueba notes:read o notes:write; todas las escrituras requieren
        expectedLibraryRevision. La biblioteca incluye no-sync. No acepta APP_PASSWORD ni la cookie web como
        credenciales MCP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jsonrpc
                - method
              properties:
                jsonrpc:
                  type: string
                  const: "2.0"
                id:
                  type:
                    - string
                    - number
                    - "null"
                method: *a4
                params:
                  type: object
      responses:
        "200":
          description: Respuesta JSON-RPC, resultado de herramienta/recurso o error MCP
          content:
            application/json:
              schema:
                type: object
            text/event-stream:
              schema: *a4
        "202":
          description: Notificación aceptada
        "400":
          description: Solicitud o versión MCP inválidas
        "401":
          description: Token ausente, caducado o revocado
          headers:
            WWW-Authenticate:
              schema: *a4
              description: Bearer resource_metadata=<URL RFC 9728>, scope=notes:read notes:write
        "403":
          description: Origen o permisos insuficientes
        "404": *a3
    options:
      tags:
        - mcp
      summary: Preflight CORS MCP desde el origen de neopen
      security: *a2
      responses:
        "204":
          description: Preflight permitido
        "403":
          description: Origen no permitido
        "404": *a3
    get:
      tags:
        - mcp
      summary: Método sin sesión de protocolo MCP
      security: *a7
      description: "El transporte es sin estado: no mantiene streams GET ni sesiones que terminar con DELETE. Con
        credenciales válidas responde 405; las solicitudes sin token inician descubrimiento OAuth."
      responses:
        "401":
          description: Token ausente o inválido
        "403":
          description: Origen no permitido
        "404": *a3
        "405":
          description: Método no permitido
    delete:
      tags:
        - mcp
      summary: Método sin sesión de protocolo MCP
      security: *a7
      description: "El transporte es sin estado: no mantiene streams GET ni sesiones que terminar con DELETE. Con
        credenciales válidas responde 405; las solicitudes sin token inician descubrimiento OAuth."
      responses:
        "401":
          description: Token ausente o inválido
        "403":
          description: Origen no permitido
        "404": *a3
        "405":
          description: Método no permitido
    head:
      tags:
        - mcp
      summary: Método sin sesión de protocolo MCP
      security: *a7
      description: "El transporte es sin estado: no mantiene streams GET ni sesiones que terminar con DELETE. Con
        credenciales válidas responde 405; las solicitudes sin token inician descubrimiento OAuth."
      responses:
        "401":
          description: Token ausente o inválido
        "403":
          description: Origen no permitido
        "404": *a3
        "405":
          description: Método no permitido

components:
  securitySchemes:
    WebSession:
      type: apiKey
      in: cookie
      name: neopen_session
      description: Sesión web HttpOnly de ocho horas. Las escrituras requieren además X-CSRF-Token. Si existe
        X-Auth-Password, se valida expresamente y tiene prioridad.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Token ligado a la sesión web; obtenerlo mediante GET /api/auth/session. Obligatorio en escrituras
        autenticadas por cookie.
    McpOAuth:
      type: oauth2
      description: Tokens opacos para el recurso /mcp. Descubrimiento RFC 9728 y RFC 8414; registro CIMD o DCR.
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          refreshUrl: /oauth/token
          scopes:
            notes:read: Consultar notas, cuadernos y originales
            notes:write: Gestionar notas y cuadernos existentes
            offline_access: Renovar el acceso con refresh token
    OAuthRegistrationToken:
      type: http
      scheme: bearer
      description: Token de acceso de registro del proveedor OAuth, distinto del acceso al recurso MCP.
    PenPassword:
      type: apiKey
      in: header
      name: X-Auth-Password
      description: Contraseña única del servidor (env `APP_PASSWORD`). Alternativa heredada a la sesión web en `/api/*`, salvo health público y endpoints que requieren cookie explícitamente. Nunca se acepta como token MCP.

  responses:
    Unauthorized:
      description: Falta autenticación válida; la contraseña es incorrecta o la sesión web ha caducado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Cuerpo inválido (fallo de validación)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No existe
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    WebSessionInfo:
      type: object
      required:
        - csrfToken
      properties:
        csrfToken:
          type: string
          description: CSRF ligado a la cookie HttpOnly; no es un token MCP
      additionalProperties: false
    McpSettings:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          default: false
        origin:
          type: string
          format: uri
        url:
          type: string
          format: uri
          description: URL canónica que debe introducirse en el cliente MCP
      additionalProperties: false
    OAuthInteractionDetails:
      type: object
      required:
        - uid
        - clientName
        - scopes
      properties:
        uid: &a1
          type: string
        clientName: *a1
        scopes:
          type: array
          items:
            type: string
            enum:
              - notes:read
              - notes:write
              - offline_access
      additionalProperties: false
    OAuthMetadata:
      type: object
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - scopes_supported
        - code_challenge_methods_supported
      properties:
        issuer:
          type: string
          format: uri
        authorization_endpoint:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        registration_endpoint:
          type: string
          format: uri
        revocation_endpoint:
          type: string
          format: uri
        jwks_uri:
          type: string
          format: uri
        scopes_supported:
          type: array
          items: *a1
        code_challenge_methods_supported:
          type: array
          items:
            type: string
            const: S256
        client_id_metadata_document_supported:
          type: boolean
          const: true
        authorization_response_iss_parameter_supported:
          type: boolean
          const: true
    OAuthError:
      type: object
      required:
        - error
      properties:
        error: *a1
        error_description: *a1
        error_uri:
          type: string
          format: uri
      additionalProperties: true
    Error:
      type: object
      properties:
        error: { type: string }

    ConnectorInfo:
      type: object
      required: [id, name, configured]
      properties:
        id: { type: string }
        name: { type: string }
        configured: { type: boolean }

    ConfigField:
      type: object
      required: [locked]
      properties:
        value: {}
        locked: { type: boolean }

    SecretConfigField:
      type: object
      required: [configured, locked]
      properties:
        configured: { type: boolean }
        locked: { type: boolean }
      additionalProperties: false

    ServerSettings:
      type: object
      description: Los campos secretos nunca incluyen su valor.
      required: [webdav, ftp, ocr, smtp, languageTool]
      properties:
        webdav: { type: object, additionalProperties: { $ref: "#/components/schemas/ConfigField" } }
        ftp: { type: object, additionalProperties: { $ref: "#/components/schemas/ConfigField" } }
        ocr: { type: object, additionalProperties: { $ref: "#/components/schemas/ConfigField" } }
        smtp: { type: object, additionalProperties: { $ref: "#/components/schemas/ConfigField" } }
        languageTool: { type: object, additionalProperties: { $ref: "#/components/schemas/ConfigField" } }

    CapturePatch:
      type: object
      properties:
        name: { type: string }
        tags: { type: array, items: { type: string } }
        destination: { type: string, enum: [inbox, notebook, loose] }
        notebookId: { oneOf: [{ type: string }, { type: "null" }] }
        position: { type: integer, minimum: 0 }
        paper: { oneOf: [{ $ref: "#/components/schemas/PaperSize" }, { type: "null" }] }
        kind: { oneOf: [{ type: string }, { type: "null" }] }
        sealed: { type: boolean }

    NotebookInput:
      type: object
      required: [name, color]
      properties:
        name: { type: string }
        color: { type: string }
        tags: { type: array, items: { type: string } }
        paper: { oneOf: [{ $ref: "#/components/schemas/PaperSize" }, { type: "null" }] }
        bookKey: { oneOf: [{ type: string }, { type: "null" }] }
        custom: { type: boolean }
        unclassified: { type: boolean }
        category: { oneOf: [{ type: string }, { type: "null" }] }

    NotebookPatch:
      type: object
      properties:
        name: { type: string }
        color: { type: string }
        tags: { type: array, items: { type: string } }
        category: { oneOf: [{ type: string }, { type: "null" }] }

    OcrResult:
      type: object
      required: [text, tags, todos, dates]
      properties:
        title: { type: string }
        text: { type: string }
        language: { type: string }
        tags: { type: array, items: { type: string } }
        todos: { type: array, items: { type: object } }
        dates: { type: array, items: { type: object } }

    TranscriptionPush:
      type: object
      required: [transcription]
      properties:
        transcription: { $ref: "#/components/schemas/OcrResult" }
        tags: { type: array, items: { type: string } }
        name: { type: string }
        kind: { type: string }

    Deletion:
      type: object
      required: [id, kind, rev]
      properties:
        id: { type: string }
        kind: { type: string, enum: [capture, notebook] }
        rev: { type: integer, minimum: 1 }

    ChangesResponse:
      type: object
      required: [cursor, hasMore, captures, notebooks, deletions]
      properties:
        cursor: { type: integer, minimum: 0 }
        hasMore: { type: boolean }
        reset: { type: boolean }
        captures: { type: array, items: { $ref: "#/components/schemas/Capture" } }
        notebooks: { type: array, items: { $ref: "#/components/schemas/Notebook" } }
        deletions: { type: array, items: { $ref: "#/components/schemas/Deletion" } }

    SobpScanInput:
      type: object
      required: [label, sobp]
      properties:
        label: { type: string }
        sobp: { $ref: "#/components/schemas/Sobp" }
        pen: { type: string }

    SobpScan:
      allOf:
        - $ref: "#/components/schemas/SobpScanInput"
        - type: object
          required: [id, scannedAt]
          properties:
            id: { type: string }
            scannedAt: { type: string, format: date-time }

    Sobp:
      type: object
      description: Identidad Ncode de la página física (Section.Owner.Book.Page).
      required: [section, owner, book, page]
      properties:
        section: { type: integer, minimum: 0 }
        owner: { type: integer, minimum: 0 }
        book: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 0 }

    Dot:
      type: object
      required: [x, y, f]
      properties:
        x: { type: number, description: Coordenada X en celdas Ncode }
        y: { type: number, description: Coordenada Y en celdas Ncode }
        f: { type: number, description: Presión 0.0–1.0 }
        t: { type: integer, description: "Timestamp absoluto en ms (epoch), si está" }

    Stroke:
      type: object
      description: Trazo continuo (PEN_DOWN, N×PEN_MOVE, PEN_UP).
      required: [startTime, endTime, dots]
      properties:
        startTime: { type: integer, description: ms epoch del primer dot }
        endTime: { type: integer, description: ms epoch del último dot }
        color:
          type: [integer, "null"]
          minimum: -2147483648
          maximum: 4294967295
          description: ARGB de 32 bits. Acepta uint32 del SDK web y devuelve int32 con signo.
        width: { type: [number, "null"], exclusiveMinimum: 0 }
        dots:
          type: array
          items: { $ref: "#/components/schemas/Dot" }

    PaperSize:
      type: object
      description: Geometría de la página física en celdas Ncode.
      required: [x0, y0, width, height]
      properties:
        x0: { type: number }
        y0: { type: number }
        width: { type: number }
        height: { type: number }
        source: { type: string, description: '"neolab" | id de preset | "manual"' }

    CreateCaptureInput:
      type: object
      required: [sobp, source, capturedAt, name, strokes]
      properties:
        sobp: { $ref: "#/components/schemas/Sobp" }
        notebook:
          type: string
          description: Nombre legible de la libreta (si el cliente lo conoce). Se usa como nombre del cuaderno auto-creado.
        source: { type: string, enum: [realtime, offline] }
        capturedAt: { type: string, format: date-time }
        name: { type: string }
        tags:
          type: array
          items: { type: string }
          default: []
        strokes:
          type: array
          items: { $ref: "#/components/schemas/Stroke" }
        paper:
          allOf: [{ $ref: "#/components/schemas/PaperSize" }]
          description: Opcional. Solo siembra el formato de un cuaderno nuevo.
        destination:
          type: string
          enum: [inbox, notebook, loose]
          description: Normalmente OMITIR — el servidor archiva en "notebook".
        notebookId:
          type: string
          description: Normalmente OMITIR — el servidor resuelve el cuaderno por SOBP.
        mergeMode:
          type: string
          enum: [auto, forceNew, mergeTarget]
          description: Ausente/"auto" conserva la fusión por SOBP. Solo lo usa /api/captures/ingest.
        targetCaptureId:
          type: string
          description: Captura destino cuando mergeMode = "mergeTarget".

    MigrationCapture:
      allOf:
        - $ref: "#/components/schemas/CreateCaptureInput"
        - type: object
          required: [id]
          properties:
            id: { type: string }
            rev: { type: integer, minimum: 0, description: Ignorada; el servidor asigna su propia revisión. }
            importedAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            position: { type: integer, minimum: 0 }
            kind: { type: [string, "null"] }
            sealed: { type: boolean }
            clonedFrom: { type: [string, "null"] }
            transcription: { oneOf: [{ $ref: "#/components/schemas/OcrResult" }, { type: "null" }] }
            overlap: { oneOf: [{ $ref: "#/components/schemas/Overlap" }, { type: "null" }] }

    MigrationNotebook:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string }
        rev: { type: integer, minimum: 0, description: Ignorada; el servidor asigna su propia revisión. }
        name: { type: string }
        color: { type: string }
        tags: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        paper: { oneOf: [{ $ref: "#/components/schemas/PaperSize" }, { type: "null" }] }
        paperSource: { type: string }
        bookKey: { type: [string, "null"] }
        coverUrl: { type: [string, "null"] }
        unclassified: { type: boolean }
        custom: { type: boolean }
        category: { type: [string, "null"] }

    Capture:
      allOf:
        - $ref: "#/components/schemas/CreateCaptureInput"
        - type: object
          required: [id, rev, importedAt, updatedAt, destination, position]
          properties:
            id: { type: string }
            rev: { type: integer, minimum: 1 }
            importedAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            destination: { type: string, enum: [inbox, notebook, loose] }
            notebookId: { type: string }
            position: { type: integer }
            kind: { type: string, description: "Tipo detectado: [TODO], [AGENDA]…" }
            sealed:
              type: boolean
              description: Hoja finalizada; deja de recibir fusiones por SOBP.
            overlap:
              oneOf: [{ $ref: "#/components/schemas/Overlap" }, { type: "null" }]
              description: Aviso de trazos superpuestos (o null si no hay).
            transcription:
              $ref: "#/components/schemas/OcrResult"
              description: Resultado del OCR/HTR, si la hoja se ha transcrito.
            clonedFrom: { oneOf: [{ type: string }, { type: "null" }] }

    Overlap:
      type: object
      description: Aviso de trazos nuevos escritos encima del contenido previo.
      required: [strokeIndex, atTime, overlappingStrokes, areaPercent]
      properties:
        strokeIndex: { type: integer, description: Índice de corte sugerido (trazos ordenados por startTime) }
        atTime: { type: integer, description: startTime (ms) del primer trazo superpuesto }
        overlappingStrokes: { type: integer }
        areaPercent: { type: integer, description: "% del contenido previo pisado (0–100)" }

    OverlapConfig:
      type: object
      required: [enabled, minStrokes, minAreaPercent]
      properties:
        enabled: { type: boolean }
        minStrokes: { type: integer, minimum: 1, maximum: 100 }
        minAreaPercent: { type: integer, minimum: 0, maximum: 100 }

    PenInfo:
      type: object
      required: [mac, firstSeen, lastSeen]
      properties:
        mac: { type: string }
        alias: { type: string }
        name: { type: string }
        firmware: { type: string }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        forgotten:
          type: boolean
          description: No usar para autoselección/reconexión automática.
        locked:
          type: boolean
          description: Preferir solo este boli para reconexión. NO es el estado de cifrado/PIN.
        style:
          oneOf: [{ $ref: "#/components/schemas/StrokeStyle" }, { type: "null" }]
          description: Estilo por defecto del boli; null = sin definir.

    Notebook:
      type: object
      required: [id, rev, name, color, tags, createdAt, updatedAt]
      properties:
        id: { type: string }
        rev: { type: integer, minimum: 1 }
        name: { type: string }
        color: { type: string }
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        paper:
          oneOf: [{ $ref: "#/components/schemas/PaperSize" }, { type: "null" }]
          description: Formato del cuaderno; null = sin definir.
        paperSource: { type: string }
        bookKey: { type: string, description: '"section.owner.book" (solo cuadernos por SOBP)' }
        coverUrl: { type: string, description: Ruta pública de la portada (/covers/...) }
        unclassified: { type: boolean, description: Pila "Sin clasificar" (sus hojas no aplican formato) }
        custom: { type: boolean }
        category: { oneOf: [{ type: string }, { type: "null" }] }

    Capabilities:
      type: object
      properties:
        revision:
          type: integer
          minimum: 0
          description: Revisión global de capturas y cuadernos, incluidos ediciones y borrados desde cualquier cliente.
        connectors:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              configured: { type: boolean }
        ocr:
          type: object
          properties:
            enabled: { type: boolean }
            model: { type: string }

    StrokeStyle:
      type: object
      required: [color, width]
      properties:
        color: { type: integer, description: Color ARGB como entero de 32 bits con signo. }
        width: { type: number, description: Grosor base (> 0). }

    RenderSettings:
      type: object
      required: [pressureWidthEnabled, pressureWidthContrast]
      properties:
        pressureWidthEnabled:
          type: boolean
          description: Si la presión (dot.f) modula el grosor del trazo en el render.
        pressureWidthContrast:
          type: number
          minimum: 0.5
          maximum: 3
          description: Multiplicador de diferencia fino/grueso (0.5–3).

    OfflineReimportPolicy:
      type: string
      enum: [ask, discard, newCapture, merge]
      description: >
        Qué hacer cuando un volcado offline trae trazos de una página borrada/movida.
        "ask" deja un aviso pendiente; el resto se resuelve automáticamente al ingerir.

    OfflineImportWarning:
      type: object
      description: Aviso persistido cuando un volcado offline recupera trazos de una página intervenida.
      required: [id, sobp, source, capturedAt, importedAt, name, strokes, reasonAction, actionAt, status]
      properties:
        id: { type: string }
        sobp: { $ref: "#/components/schemas/Sobp" }
        source: { type: string, enum: [offline] }
        capturedAt: { type: string, format: date-time }
        importedAt: { type: string, format: date-time }
        name: { type: string }
        strokes:
          type: array
          items: { $ref: "#/components/schemas/Stroke" }
        paper:
          oneOf: [{ $ref: "#/components/schemas/PaperSize" }, { type: "null" }]
        reasonAction: { type: string, enum: [deleted, moved] }
        actionCaptureId: { type: [string, "null"] }
        actionCaptureName: { type: [string, "null"] }
        actionDestination:
          oneOf: [{ type: string, enum: [inbox, notebook, loose] }, { type: "null" }]
        actionNotebookId: { type: [string, "null"] }
        actionNotebookName: { type: [string, "null"] }
        actionAt: { type: string, format: date-time }
        targetCaptureId: { type: [string, "null"] }
        status: { type: string, enum: [pending, discarded, newCapture, merged] }
        resolvedAt: { type: [string, "null"], format: date-time }

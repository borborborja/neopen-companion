openapi: 3.1.0
info:
  title: neopen API
  version: "0.24.0"
  description: |
    Contrato de la API del servidor neopen, pensado como **fuente de verdad para
    clientes nativos** (companion Android/iOS) además del frontend web.

    El cometido de un companion es: conectar por BLE al Neo smartpen M1+, captar
    los trazos (live u offline) y **subirlos en crudo** a `POST /api/captures`.
    El **servidor archiva** automáticamente cada hoja en su cuaderno (por SOBP):
    el cliente NO necesita conocer la lógica de cuadernos ni de formato.

    Mantén esta versión en sync con `packages/shared/src/index.ts` y los esquemas
    zod de `apps/server/src/routes/`.
servers:
  - url: http://localhost:3000
    description: Desarrollo
  - url: https://neopen.example.net
    description: Instancia autoalojada
security:
  - PenPassword: []
  - WebSession: []
tags:
  - name: auth
    description: Sesión web compartida y autenticación heredada
  - name: mcp
    description: MCP opcional para herramientas y recursos de biblioteca
  - name: oauth
    description: Autorización OAuth 2.1 con PKCE para clientes MCP
  - name: captures
    description: Subida de la escritura del boli (lo esencial para un companion)
  - name: pens
    description: Registro del boli
  - name: notebooks
    description: Cuadernos (solo lectura para un companion)
  - name: meta
    description: Salud y capacidades
  - name: settings
    description: Configuración editable y preferencias del servidor
  - name: connectors
    description: Conectores de almacenamiento y rclone
  - name: sync
    description: Sincronización incremental y exportación a conectores
  - name: studio
    description: Ncode Studio, plantillas, fondos y anclajes
  - name: admin
    description: Operaciones administrativas protegidas
  - name: assets
    description: Portadas y fondos públicos referenciados por UUID

paths:
  /api/health:
    get:
      tags: [meta]
      summary: Healthcheck (público, sin auth)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, version]
                properties:
                  ok: { type: boolean, const: true }
                  version: { type: string, example: 0.24.0 }

  /api/capabilities:
    get:
      tags: [meta]
      summary: Conectores activos y estado del OCR
      responses:
        "200":
          description: Capacidades del servidor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/captures:
    get:
      tags: [captures]
      summary: Lista todas las capturas (orden por última edición)
      responses:
        "200":
          description: Lista de capturas
          content:
            application/json:
              schema:
                type: object
                properties:
                  captures:
                    type: array
                    items: { $ref: "#/components/schemas/Capture" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [captures]
      summary: Sube una hoja del boli (el servidor la archiva en su cuaderno)
      description: |
        El cliente sube la captura **en crudo**: basta con `sobp`, `source`,
        `capturedAt`, `name` y `strokes`. Si NO se envía `notebookId`, el servidor
        resuelve el cuaderno por SOBP (lo crea si no existe) y enruta a la pila
        "Sin clasificar" si esa libreta está marcada así.

        - `paper` (formato físico, p. ej. de NeoLAB) es opcional y **solo siembra
          el formato de un cuaderno nuevo**; las hojas heredan el formato de su
          cuaderno.
        - Re-subir la misma hoja (mismo SOBP) **fusiona** los trazos nuevos
          (append-only con dedupe por `startTime`+nº de dots); nunca duplica ni
          borra. Idempotente para reintentos.
        - Cabecera opcional `X-Neopen-Device`: nombre del dispositivo companion
          (p. ej. "Google Pixel 7"). El servidor anota la última subida y la web
          muestra "Actualizado desde &lt;dispositivo&gt;".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCaptureInput" }
      responses:
        "201":
          description: Captura creada o fusionada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capture" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/captures/{id}:
    patch:
      tags: [captures]
      summary: Actualiza metadatos o destino de una captura
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapturePatch" }
      responses:
        "200":
          description: Captura actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capture" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [captures]
      summary: Borra una captura
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Borrada }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/captures/{id}/split:
    post:
      tags: [captures]
      summary: Corta una hoja con trazos superpuestos
      description: >
        Parte la hoja por `cutIndex` (índice en los trazos ordenados por startTime):
        los anteriores quedan en la original (que se SELLA), los posteriores van a
        una hoja nueva. Rechaza (404) un corte vacío o en los extremos.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cutIndex, mode]
              properties:
                cutIndex: { type: integer, minimum: 0 }
                mode: { type: string, enum: [newSheet, newNotebook] }
      responses:
        "201":
          description: Hoja original (sellada) + hoja nueva
          content:
            application/json:
              schema:
                type: object
                properties:
                  original: { $ref: "#/components/schemas/Capture" }
                  created: { $ref: "#/components/schemas/Capture" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/captures/{id}/dismiss-overlap:
    post:
      tags: [captures]
      summary: Descarta el aviso de trazos superpuestos (sin cortar)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Captura con el aviso limpiado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capture" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/overlap:
    get:
      tags: [captures]
      summary: Umbral de detección de trazos superpuestos
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OverlapConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [captures]
      summary: Cambia el umbral de detección de trazos superpuestos
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OverlapConfig" }
      responses:
        "200":
          description: Config guardada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OverlapConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/finish-mode:
    get:
      tags: [captures]
      summary: Modo al finalizar una hoja
      responses:
        "200":
          description: Modo actual
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string, enum: [newSheet, newNotebook] }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [captures]
      summary: Cambia el modo al finalizar una hoja
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [newSheet, newNotebook] }
      responses:
        "200":
          description: Modo guardado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string, enum: [newSheet, newNotebook] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/pens:
    get:
      tags: [pens]
      summary: Lista los bolis registrados
      responses:
        "200":
          description: Bolis
          content:
            application/json:
              schema:
                type: object
                properties:
                  pens:
                    type: array
                    items: { $ref: "#/components/schemas/PenInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [pens]
      summary: Alta/refresco del boli al conectarse (upsert por MAC)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mac]
              properties:
                mac: { type: string, example: "9C:7B:D2:..." }
                name: { type: string, description: Nombre Bluetooth }
                firmware: { type: string }
      responses:
        "201":
          description: Boli registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PenInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/pens/{mac}:
    patch:
      tags: [pens]
      summary: Edita el boli (alias y preferencias de reconexión)
      description: >
        Todos los campos son opcionales. `forgotten` saca el boli de la
        autoselección/reconexión automática; `locked` lo marca como el único
        preferido; `style` fija su estilo por defecto (o `null` para quitarlo).
        No tiene nada que ver con el PIN/cifrado del boli (eso es BLE punto a
        punto, el servidor no lo gestiona).
      parameters:
        - { name: mac, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alias: { type: string }
                forgotten: { type: boolean }
                locked: { type: boolean }
                style:
                  oneOf:
                    - { $ref: "#/components/schemas/StrokeStyle" }
                    - { type: "null" }
      responses:
        "200":
          description: Boli actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PenInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/render-settings:
    get:
      tags: [captures]
      summary: Ajustes de render (presión → grosor)
      responses:
        "200":
          description: Ajustes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenderSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [captures]
      summary: Cambia los ajustes de render (rehace los ficheros sincronizados afectados)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenderSettings" }
      responses:
        "200":
          description: Ajustes guardados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenderSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/captures/ingest:
    post:
      tags: [captures]
      summary: Ingesta consciente de conflictos (variante de POST /api/captures)
      description: >
        Como POST /api/captures pero aplica la política de reimportación offline.
        Si la página fue borrada/movida, devuelve un aviso (o discarded) en vez de
        fusionar. El companion Android usa hoy el POST /api/captures clásico.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCaptureInput" }
      responses:
        "200":
          description: Resultado de la ingesta
          content:
            application/json:
              schema:
                type: object
                properties:
                  capture:
                    oneOf: [{ $ref: "#/components/schemas/Capture" }, { type: "null" }]
                  warning:
                    oneOf: [{ $ref: "#/components/schemas/OfflineImportWarning" }, { type: "null" }]
                  discarded: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/offline-import-warnings:
    get:
      tags: [captures]
      summary: Avisos de reimportación offline pendientes
      responses:
        "200":
          description: Avisos
          content:
            application/json:
              schema:
                type: object
                properties:
                  warnings:
                    type: array
                    items: { $ref: "#/components/schemas/OfflineImportWarning" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/offline-import-warnings/{id}/discard:
    post:
      tags: [captures]
      summary: Descarta un aviso (los trazos no se importan)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Aviso resuelto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfflineImportWarning" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/offline-import-warnings/{id}/new-capture:
    post:
      tags: [captures]
      summary: Crea una hoja nueva con los trazos del aviso
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "201":
          description: Hoja creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capture" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/offline-import-warnings/{id}/merge:
    post:
      tags: [captures]
      summary: Fusiona los trazos del aviso en la captura destino
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Captura destino actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capture" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/offline-reimport-policy:
    get:
      tags: [captures]
      summary: Política global de reimportación offline
      responses:
        "200":
          description: Política
          content:
            application/json:
              schema:
                type: object
                properties:
                  policy: { $ref: "#/components/schemas/OfflineReimportPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [captures]
      summary: Cambia la política global de reimportación offline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy]
              properties:
                policy: { $ref: "#/components/schemas/OfflineReimportPolicy" }
      responses:
        "200":
          description: Política guardada
          content:
            application/json:
              schema:
                type: object
                properties:
                  policy: { $ref: "#/components/schemas/OfflineReimportPolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/notebooks:
    get:
      tags: [notebooks]
      summary: Lista los cuadernos (un companion normalmente solo los lee)
      responses:
        "200":
          description: Cuadernos
          content:
            application/json:
              schema:
                type: object
                properties:
                  notebooks:
                    type: array
                    items: { $ref: "#/components/schemas/Notebook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [notebooks]
      summary: Crea un cuaderno
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotebookInput" }
      responses:
        "201":
          description: Cuaderno creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notebook" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/changes:
    get:
      tags: [captures]
      summary: Delta de capturas, cuadernos y borrados desde un cursor
      parameters:
        - { name: since, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        "200":
          description: Lote incremental
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/captures/{id}/clone:
    post:
      tags: [captures]
      summary: Copia una captura a un cuaderno personalizado
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notebookId]
              properties:
                notebookId: { type: string }
                position: { type: integer, minimum: 0 }
      responses:
        "201":
          description: Captura clonada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capture" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/captures/{id}/transcribe:
    post:
      tags: [captures]
      summary: Transcribe una captura con el proveedor OCR del servidor
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
                instructions: { type: string }
      responses:
        "200":
          description: Captura transcrita
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capture" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: OCR no configurado }

  /api/captures/{id}/transcription:
    put:
      tags: [captures]
      summary: Guarda una transcripción ya generada por un cliente
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TranscriptionPush" }
      responses:
        "200":
          description: Captura actualizada sin invocar el OCR del servidor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capture" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/detection:
    get:
      tags: [captures]
      summary: Configuración de detección de marcadores
      responses:
        "200": { description: Configuración actual }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [captures]
      summary: Actualiza la detección de marcadores
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, lines]
              properties:
                enabled: { type: boolean }
                lines: { type: integer, minimum: 1, maximum: 20 }
      responses:
        "200": { description: Configuración guardada }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/export:
    get:
      tags: [admin]
      summary: Exporta una copia completa de capturas, cuadernos y portadas
      responses:
        "200": { description: Copia JSON completa }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/import:
    post:
      tags: [admin]
      summary: Restaura una copia completa reemplazando el contenido actual
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Totales importados }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/migration:
    put:
      tags: [admin]
      summary: Vincula contenido local sin borrar otros datos ni fusionar revisiones por SOBP
      description: >-
        Upsert aditivo por id estable. Reintentar el mismo registro no lo duplica.
        Enviar primero los cuadernos y después sus capturas. Los ids son obligatorios;
        una captura con notebookId debe referenciar un cuaderno existente o incluido.
        Conserva OCR, formato, archivo, posición, sellado, clon y aviso de solapamiento.
        Un servidor anterior sin esta operación responde 404; el cliente conserva su outbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [captures, notebooks]
              properties:
                captures:
                  type: array
                  maxItems: 1
                  items: { $ref: "#/components/schemas/MigrationCapture" }
                notebooks:
                  type: array
                  maxItems: 1
                  items: { $ref: "#/components/schemas/MigrationNotebook" }
      responses:
        "204": { description: Registros guardados }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/notebooks/unclassified:
    get:
      tags: [notebooks]
      summary: Obtiene o crea el cuaderno reservado Sin clasificar
      responses:
        "200":
          description: Cuaderno reservado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notebook" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/notebooks/{id}:
    patch:
      tags: [notebooks]
      summary: Edita un cuaderno
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotebookPatch" }
      responses:
        "200":
          description: Cuaderno actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notebook" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [notebooks]
      summary: Borra un cuaderno y mueve sus hojas a Sin clasificar
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Borrado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/notebooks/{id}/order:
    put:
      tags: [notebooks]
      summary: Reordena las capturas de un cuaderno
      parameters:
